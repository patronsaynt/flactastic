<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Download Page" description="Pick between downloading individual tracks & albums or whole playlists — hovering a panel expands it and blurs the rest of the screen behind glass." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; }
  @keyframes flRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes flFade { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>
<div class="{{ themeClass }}" style="font-family: var(--fl-font-sans); position: fixed; inset: 0; background: var(--fl-background); color: var(--fl-text-primary); overflow: hidden; -webkit-font-smoothing: antialiased;">

  <section data-screen-label="Download chooser" style="position: absolute; inset: 0; display: flex; flex-direction: column;">

    <!-- Glass backdrop — fades in on hover; the hovered panel is lifted above it, everything else falls behind it. -->
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1; pointer-events: none; transition: opacity 0.45s cubic-bezier(0.16,1,0.3,1); {{ overlayStyle }}"></div>

    <header style="padding: 52px 48px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; animation: flRise 0.5s cubic-bezier(0.16,1,0.3,1) both;">
      <div style="display: flex; align-items: center; gap: 9px; color: var(--fl-text-tertiary); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.2"></circle></svg>
        <span>FLACtastic</span>
      </div>
      <h1 style="margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -0.6px;">Download</h1>
      <p style="margin: 0; max-width: 520px; font-size: 15px; line-height: 1.5; color: var(--fl-text-secondary);">Choose what you'd like to pull down — every file arrives in its original lossless quality.</p>
    </header>

    <div style="flex: 1; display: flex; align-items: stretch; justify-content: center; gap: 24px; padding: 28px 48px 60px; max-width: 1140px; width: 100%; margin: 0 auto;">

      <!-- LEFT: Tracks & Albums -->
      <button type="button" onMouseEnter="{{ onEnterLeft }}" onMouseLeave="{{ onLeavePanels }}" style="flex: 1; min-height: 380px; display: flex; flex-direction: column; text-align: left; cursor: pointer; padding: 36px; border-radius: var(--fl-radius-card); font-family: inherit; animation: flFade 0.55s ease 0.06s both; transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.5s cubic-bezier(0.16,1,0.3,1), color 0.3s ease; {{ leftPanelStyle }}">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <div style="width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: rgba(127,127,127,0.10);">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5.3" opacity="0.45"></circle><circle cx="12" cy="12" r="2.3"></circle><path d="M12 3a9 9 0 0 1 6.4 2.6" opacity="0.55"></path></svg>
          </div>
          <span style="font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fl-text-tertiary);">Individual</span>
        </div>
        <div style="margin-top: auto;">
          <h2 style="margin: 0 0 10px; font-size: 28px; font-weight: 600; letter-spacing: -0.3px;">Tracks &amp; Albums</h2>
          <p style="margin: 0 0 22px; font-size: 14px; line-height: 1.5; color: var(--fl-text-secondary); max-width: 34ch;">Hand-pick singles or grab a complete album. Each file in full studio fidelity, exactly as it was mastered.</p>
          <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;">Browse library
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </span>
        </div>
      </button>

      <!-- RIGHT: Playlists -->
      <button type="button" onMouseEnter="{{ onEnterRight }}" onMouseLeave="{{ onLeavePanels }}" style="flex: 1; min-height: 380px; display: flex; flex-direction: column; text-align: left; cursor: pointer; padding: 36px; border-radius: var(--fl-radius-card); font-family: inherit; animation: flFade 0.55s ease 0.12s both; transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.5s cubic-bezier(0.16,1,0.3,1), color 0.3s ease; {{ rightPanelStyle }}">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <div style="width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: rgba(127,127,127,0.10);">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13"></path><path d="M3 11h13"></path><path d="M3 16h6"></path><circle cx="17" cy="16.5" r="4.2"></circle><path d="M15.4 14.7l3 1.8-3 1.8z" fill="currentColor" stroke="none"></path></svg>
          </div>
          <span style="font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fl-text-tertiary);">Collections</span>
        </div>
        <div style="margin-top: auto;">
          <h2 style="margin: 0 0 10px; font-size: 28px; font-weight: 600; letter-spacing: -0.3px;">Playlists</h2>
          <p style="margin: 0 0 22px; font-size: 14px; line-height: 1.5; color: var(--fl-text-secondary); max-width: 34ch;">Download a whole playlist in a single pass. We bundle every track at the highest fidelity it's available in.</p>
          <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;">View playlists
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </span>
        </div>
      </button>

    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;highlightStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Signature&quot;,&quot;Monochrome&quot;],&quot;default&quot;:&quot;Monochrome&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dark&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { hover: null };

  renderVals() {
    const { hover } = this.state;
    const light = (this.props.theme ?? 'Dark') === 'Light';
    const mono = (this.props.highlightStyle ?? 'Monochrome') === 'Monochrome';

    const monoAccent = light ? '#141414' : '#f2f2f2';
    const monoGlow = light ? 'rgba(0,0,0,0.22)' : 'rgba(242,242,242,0.22)';
    const leftAccent = mono ? monoAccent : '#00e5cc';
    const rightAccent = mono ? monoAccent : '#4dd966';
    const leftGlow = mono ? monoGlow : 'rgba(0,229,204,0.42)';
    const rightGlow = mono ? monoGlow : 'rgba(77,217,102,0.42)';

    // Every property the hover toggles lives ONLY here (never in the base
    // inline style) so the interpolated hole always wins the merge.
    const resting = 'background: var(--fl-surface); border: 1px solid var(--fl-divider); color: var(--fl-text-primary); transform: none; box-shadow: none; z-index: 0;';
    // Expand + pop crisp above the glass backdrop.
    const lift = (acc, glow) =>
      `background: var(--fl-surface-elevated); border: 1px solid ${acc}; color: ${acc}; transform: translateY(-14px) scale(1.05); box-shadow: 0 32px 90px ${glow}, 0 0 0 1px ${acc}; position: relative; z-index: 2;`;

    const leftPanelStyle = hover === 'left' ? lift(leftAccent, leftGlow) : resting;
    const rightPanelStyle = hover === 'right' ? lift(rightAccent, rightGlow) : resting;

    const scrim = light ? 'rgba(245,245,245,0.45)' : 'rgba(0,0,0,0.5)';
    const overlayStyle =
      `opacity: ${hover ? 1 : 0}; background: ${scrim}; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);`;

    return {
      themeClass: light ? 'theme-light' : '',
      leftPanelStyle, rightPanelStyle, overlayStyle,
      onEnterLeft: () => this.setState({ hover: 'left' }),
      onEnterRight: () => this.setState({ hover: 'right' }),
      onLeavePanels: () => this.setState({ hover: null }),
    };
  }
}
</script>
</body>
</html>
